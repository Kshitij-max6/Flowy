      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            ${{ steps.assets.outputs.file }}
            ${{ steps.assets.outputs.file }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true

      # What phones will really see: the release the updater asks GitHub for, and the files users download.
      - name: Confirm what the app will find
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.assets.outputs.file }}
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6; do
            LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
            [ "$LATEST" = "$TAG" ] && break
            sleep 10
          done
          [ "$LATEST" = "$TAG" ] || { echo "::error title=Release is not 'latest'::GitHub reports '${LATEST:-nothing}' as the latest release, not $TAG, so Flowly would not see it. Check the Releases page (it must not be a draft or pre-release)."; exit 1; }
          mkdir -p "$RUNNER_TEMP/dl"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/dl" --pattern "$APK" --pattern "$APK.sha256" --clobber
          ( cd "$RUNNER_TEMP/dl" && sha256sum -c "$APK.sha256" ) \
            || { echo "::error title=Published files do not match::The APK that users download does not match the published checksum."; exit 1; }
          cmp -s "$RUNNER_TEMP/dl/$APK" "$APK" \
            || { echo "::error title=Published APK differs::The published APK is not byte-identical to the one that was verified."; exit 1; }
          echo "Release $TAG is live: it is GitHub's latest release, and its APK and checksum download correctly and match."

      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/flowly-release.jks" "$RUNNER_TEMP/check.csr" debug.keystore app/google-services.json
