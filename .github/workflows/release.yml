name: Release Flowly APK

# Push a tag like v1.2.0 to publish a signed APK as a GitHub Release.
# The in-app updater reads that release, so the signing key MUST be the same every time (see RELEASING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Work out and validate version from the tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Accept v1.2.0, V1.2.0, or 1.2.0; reject malformed tags.
          NAME="$(printf '%s' "$TAG" | sed -E 's/^[vV]//')"
          if ! [[ "$NAME" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH (example: v1.2.0); got $TAG"
            exit 1
          fi
          IFS='.' read -r MAJ MIN PAT <<< "$NAME"
          CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          if [ "$CODE" -le 10100 ]; then
            echo "::error::Calculated versionCode $CODE must be greater than the Flowly 1.1.0 baseline (10100)."
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Release versionName=$NAME versionCode=$CODE"

      - name: Restore the permanent release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "KEYSTORE_BASE64 secret is missing - see RELEASING.md"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/flowly-release.jks"

      - name: Debug keystore (needed by the debug signing config)
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Restore google-services.json (optional)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GS_B64" ]; then echo "$GS_B64" | base64 -d > app/google-services.json; fi

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/flowly-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          UPDATE_REPO: ${{ github.repository }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK version metadata matches the release tag
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | grep -F "versionCode='${{ steps.ver.outputs.code }}'" >/dev/null             || { echo "::error::APK versionCode does not match tag-derived versionCode"; exit 1; }
          echo "$BADGING" | grep -F "versionName='${{ steps.ver.outputs.name }}'" >/dev/null             || { echo "::error::APK versionName does not match tag-derived versionName"; exit 1; }
          echo "Verified APK metadata for ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})"

      # Fails the build if the repository the in-app updater should check did not reach the APK.
      - name: Verify the update repository is baked into the APK
        env:
          UPDATE_REPO: ${{ github.repository }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          unzip -p "$APK" 'classes*.dex' | grep -a -F -q -- "$UPDATE_REPO" \
            || { echo "::error::$APK does not contain the update repository $UPDATE_REPO"; exit 1; }
          echo "Update repository baked into $APK: $UPDATE_REPO"

      - name: Name the APK and write its checksum
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "Flowly-${{ github.ref_name }}.apk"
          sha256sum "Flowly-${{ github.ref_name }}.apk" > "Flowly-${{ github.ref_name }}.apk.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Flowly-${{ github.ref_name }}.apk
            Flowly-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
