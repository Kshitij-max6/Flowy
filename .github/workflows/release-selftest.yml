name: Release scripts self-test

# Re-runs the release scripts against simulated good and bad situations whenever they (or the workflows) change,
# so a future edit cannot quietly break the release safety checks.
on:
  push:
    paths:
      - '.github/release/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/release/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Lint the workflows
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -ignore 'SC2012'
      - name: Run the release script tests
        run: bash .github/release/tests/run-tests.sh
