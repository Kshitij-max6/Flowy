
name: Build Flowly debug APK (testing only - not updatable, use release.yml for real releases)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Restore google-services.json (optional)
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GS_B64" ]; then
            echo "$GS_B64" | base64 -d > app/google-services.json
          fi

      - name: Build debug APK
        env:
          UPDATE_REPO: ${{ github.repository }}
        run: gradle :app:assembleDebug --stacktrace

      # Fails the build if the repository the in-app updater should check did not reach the APK.
      - name: Verify the update repository is baked into the APK
        env:
          UPDATE_REPO: ${{ github.repository }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          unzip -p "$APK" 'classes*.dex' | grep -a -F -q -- "$UPDATE_REPO" \
            || { echo "::error::$APK does not contain the update repository $UPDATE_REPO"; exit 1; }
          echo "Update repository baked into $APK: $UPDATE_REPO"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
